<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NeotkoCM · Sandwich, all together</title>
<style>
  :root{
    --bg:#0d1626;
    --grid:rgba(110,150,205,.09);
    --grid2:rgba(110,150,205,.20);
    --line:#e6fbf7;
    --dim:rgba(230,251,247,.55);
    --teal:#009688;
    --pink:#ff15a5;
    --yellow:#e3ff2a;
    --blue:#2196f3;
    --dark:#2b3436;
    --mono:'JetBrains Mono','IBM Plex Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--line);font-family:var(--mono);overflow:hidden}
  body{
    background-image:
      linear-gradient(var(--grid2) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  svg{width:min(100vw,100vh*1.77);height:auto;max-height:100vh}

  .ui{position:fixed;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:12px;font-size:12px;color:var(--dim);pointer-events:none;letter-spacing:.08em;text-transform:uppercase}
  .ui.hidden{opacity:0}
  .ui kbd{border:1px solid var(--dim);padding:2px 6px;border-radius:3px;color:var(--line)}
  .step-num{position:fixed;top:21px;left:150px;font-size:11px;color:var(--dim);letter-spacing:.2em}
  .title{position:fixed;top:20px;right:24px;font-size:11px;color:var(--dim);letter-spacing:.2em;text-align:right}

  .stroke{stroke:var(--line);stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .stroke-dim{stroke:var(--dim);stroke-width:1;fill:none;stroke-dasharray:3 4}
  .label{font-family:var(--mono);fill:var(--line);font-size:11px;letter-spacing:.12em}
  .label-dim{fill:var(--dim)}
  .label-big{font-size:20px;letter-spacing:.2em}
  .label-mid{font-size:14px;letter-spacing:.15em}

  [data-fade]{opacity:0;transition:opacity .6s ease}
  [data-fade].on{opacity:1}

  .face{transition:fill .8s ease,opacity .6s ease}
  .face-base{fill:#1f6fb8;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}
  .face-side-dark{fill:#155a93}
  .face-top{fill:#2d8de0}

  rect.band{shape-rendering:crispEdges}
  #s3-content-A,#s3-content-B,#cubetop3-A,#cubetop3-B{transition:opacity .5s ease}

  @keyframes pulseGlow{0%,100%{stroke-opacity:.3}50%{stroke-opacity:1}}
  .pulse{animation:pulseGlow 1.8s ease-in-out infinite}

  .feature-card{transition:opacity .5s ease}
  .legend-chip{transition:opacity .4s ease}

  #dimmer{position:fixed;inset:0;background:rgba(6,18,18,.88);opacity:0;transition:opacity .9s ease;pointer-events:none;backdrop-filter:blur(2px)}
  #dimmer.on{opacity:1}

  #tag{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .8s ease .3s;pointer-events:none}
  #tag.on{opacity:1}
  #tag h1{font-family:var(--mono);font-size:34px;letter-spacing:.18em;margin:0;color:var(--line)}
  #tag h1 span{color:var(--teal)}
  #tag p{margin:18px 0 0;color:var(--dim);font-size:14px;letter-spacing:.25em;text-transform:uppercase}
  #tag em{color:var(--pink);font-style:normal}
  #tag .recap{margin-top:34px;display:flex;gap:22px;color:var(--dim);font-size:11px;letter-spacing:.15em}
  #tag .recap span{color:var(--line)}

  .connector{stroke:var(--teal);stroke-width:1;fill:none;stroke-dasharray:4 3;opacity:0;transition:opacity .5s}
  .connector.on{opacity:.85}

  /* ---- real-app / real-print cards (steps 13-14) ---- */
  .shot-card{filter:drop-shadow(0 16px 30px rgba(0,0,0,.6))}
  .shot-frame{fill:#0d1726;stroke:rgba(0,150,136,.8);stroke-width:1.5}
  .shot-bar{fill:rgba(0,150,136,.16)}
  .shot-name{fill:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.16em}
  @keyframes spotPulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
  .spot{fill:none;stroke:var(--yellow);stroke-width:2.6;animation:spotPulse 1.6s ease-in-out infinite}
  #shotdim{transition:opacity .6s ease}

  /* ---- interactive controls (s195) ---- */
  #progress{position:fixed;left:0;top:0;height:3px;width:0;background:var(--teal);
    box-shadow:0 0 8px var(--teal);z-index:6;transition:width .5s ease}
  #backBtn{position:fixed;top:15px;left:22px;z-index:7;font-family:var(--mono);font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dim);background:rgba(10,20,36,.82);
    border:1px solid rgba(110,150,205,.32);border-radius:8px;padding:8px 14px;cursor:pointer;
    display:flex;align-items:center;gap:8px;transition:color .15s,border-color .15s,transform .15s}
  #backBtn:hover{color:var(--line);border-color:var(--teal);transform:translateX(-2px)}
  #backBtn b{font-size:16px;line-height:1;font-weight:400}
  .ui{pointer-events:none}
  .ui button.uibtn{pointer-events:auto;font-family:var(--mono);font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--dim);background:rgba(10,20,36,.78);
    border:1px solid rgba(110,150,205,.28);border-radius:7px;padding:6px 11px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s,border-color .15s,background .15s}
  .ui button.uibtn:hover{color:var(--line);border-color:var(--teal);background:rgba(10,20,36,.95)}
  .ui button.uibtn kbd{border:1px solid currentColor;padding:1px 5px;border-radius:3px;opacity:.75;font-size:10px}
  .ui button#btnPlay{color:var(--line);border-color:rgba(0,150,136,.6)}
  .ui button#btnPlay .pglyph{font-size:11px;opacity:.9}
  body.clean #ui,body.clean #backBtn,body.clean #progress,body.clean .step-num,body.clean .title{opacity:0;pointer-events:none}
</style>
</head>
<body>

<div class="step-num" id="stepNum">STEP 01 / 14</div>
<div class="title">NEOTKOCM · ALL TOGETHER · v6</div>

<div id="stage">
<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#009688"/>
    </marker>
    <linearGradient id="pb-gradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e3ff2a"/>
      <stop offset="100%" stop-color="#2196f3"/>
    </linearGradient>
  </defs>

  <!-- feature recap cards (step 1) -->
  <g data-fade id="recap-cards" transform="translate(700,150)">
    <g class="feature-card" transform="translate(-330,0)">
      <rect x="-70" y="-30" width="140" height="60" fill="none" stroke="#e6fbf7" stroke-width="1.2"/>
      <text x="0" y="-4" text-anchor="middle" class="label" style="font-size:10px">COLORSTITCH</text>
      <text x="0" y="14" text-anchor="middle" class="label label-dim" style="font-size:9px">per-line pattern</text>
    </g>
    <g class="feature-card" transform="translate(-110,0)">
      <rect x="-70" y="-30" width="140" height="60" fill="none" stroke="#e6fbf7" stroke-width="1.2"/>
      <text x="0" y="-4" text-anchor="middle" class="label" style="font-size:10px">PATHBLEND</text>
      <text x="0" y="14" text-anchor="middle" class="label label-dim" style="font-size:9px">ramp + cap, optical blend</text>
    </g>
    <g class="feature-card" transform="translate(110,0)">
      <rect x="-70" y="-30" width="140" height="60" fill="none" stroke="#e6fbf7" stroke-width="1.2"/>
      <text x="0" y="-4" text-anchor="middle" class="label" style="font-size:10px">MULTIPASS</text>
      <text x="0" y="14" text-anchor="middle" class="label label-dim" style="font-size:9px">stacked Solid</text>
    </g>
    <g class="feature-card" transform="translate(330,0)">

  <g id="studio" transform="translate(420,470)">

    <text x="0" y="-308" text-anchor="middle" class="label label-dim" data-fade id="lbl-sub">one object, three tops, every technique from the series</text>

    <!-- recipe legend: fills in as each step gets painted/repainted -->
    <g data-fade id="legend" transform="translate(-260,-240)">
      <g class="legend-chip" id="leg-s1a"><text x="0" y="0" class="label" style="font-size:10px">STEP 1</text><text x="70" y="0" class="label label-dim" id="leg-s1a-txt" style="font-size:10px">—</text></g>
      <g class="legend-chip" id="leg-s2a" transform="translate(0,26)"><text x="0" y="0" class="label" style="font-size:10px">STEP 2</text><text x="70" y="0" class="label label-dim" id="leg-s2a-txt" style="font-size:10px">—</text></g>
      <g class="legend-chip" id="leg-s3a" transform="translate(0,52)"><text x="0" y="0" class="label" style="font-size:10px">STEP 3</text><text x="70" y="0" class="label label-dim" id="leg-s3a-txt" style="font-size:10px">—</text></g>
    </g>

    <!-- 3 flattened previews (mirrors the real per-step overlays) -->
    <g data-fade id="insets" transform="translate(-260,-130)">
      <g transform="translate(0,0)">

        <g id="s1-content-A"></g><g id="s1-content-B"></g>
        <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e6fbf7" stroke-width="1.4"/>
        <text x="50" y="118" text-anchor="middle" class="label label-dim" style="font-size:9px">STEP 1</text>
      </g>
      <g transform="translate(140,0)">
        <rect x="0" y="0" width="100" height="100" fill="#155a93" stroke="#e6fbf7" stroke-width="1.4"/>
        <g id="s2-content-A"></g><g id="s2-content-B"></g>
        <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e6fbf7" stroke-width="1.4"/>
        <text x="50" y="118" text-anchor="middle" class="label label-dim" style="font-size:9px">STEP 2</text>
      </g>
      <g transform="translate(280,0)">
        <rect x="0" y="0" width="100" height="100" fill="#155a93" stroke="#e6fbf7" stroke-width="1.4"/>
        <g id="s3-content-A"></g><g id="s3-content-B"></g>
        <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e6fbf7" stroke-width="1.4"/>
        <text x="50" y="118" text-anchor="middle" class="label label-dim" style="font-size:9px">STEP 3</text>
      </g>
    </g>

    <!-- perimeter override callback -->
    <text x="-260" y="60" class="label label-dim" data-fade id="lbl-perim">perimeter override · step 2's wall now follows its own pass color</text>

    <!-- final recipe legend (2nd pass) -->
    <g data-fade id="legend2" transform="translate(-260,90)">
      <text x="0" y="0" class="label label-dim" style="font-size:9px">REPAINTED:</text>
      <g class="legend-chip" id="leg-s1b" transform="translate(0,20)"><text x="0" y="0" class="label" style="font-size:10px">STEP 1</text><text x="70" y="0" class="label label-dim" id="leg-s1b-txt" style="font-size:10px">—</text></g>
      <g class="legend-chip" id="leg-s2b" transform="translate(0,42)"><text x="0" y="0" class="label" style="font-size:10px">STEP 2</text><text x="70" y="0" class="label label-dim" id="leg-s2b-txt" style="font-size:10px">—</text></g>
      <g class="legend-chip" id="leg-s3b" transform="translate(0,64)"><text x="0" y="0" class="label" style="font-size:10px">STEP 3</text><text x="70" y="0" class="label label-dim" id="leg-s3b-txt" style="font-size:10px">—</text></g>
    </g>
  </g>

  <!-- ============== RIGHT: 3-STEP STAIRCASE (drawn back-to-front: 3, 2, 1) ============== -->
  <g id="staircase-wrapper" transform="translate(1250,640)">

    <g data-fade id="step3-box">
      <g transform="translate(-200,-296)">
        <polygon class="face face-base face-side-dark" points="0,0 100,-58 100,32 0,90"/>
        <polygon class="face face-base" points="0,0 -100,-58 -100,32 0,90"/>

      <g transform="translate(-100,-148)">

        <polygon class="face face-base" points="0,0 -100,-58 -100,32 0,90"/>
        <polygon class="face face-base face-top" points="0,0 100,-58 0,-116 -100,-58"/>
        <polygon id="s2-top-glow" data-fade class="pulse" points="0,0 100,-58 0,-116 -100,-58" fill="none" stroke="var(--teal)" stroke-width="2.4"/>
        <polygon id="s2-perim" points="0,0 100,-58 0,-116 -100,-58" fill="none" stroke="#2196f3" stroke-width="0" opacity="0"/>

    <g data-fade id="step1-box">
      <g transform="translate(0,0)">
        <polygon class="face face-base face-side-dark" points="0,0 100,-58 100,32 0,90"/>
        <polygon class="face face-base" points="0,0 -100,-58 -100,32 0,90"/>
        <polygon class="face face-base face-top" points="0,0 100,-58 0,-116 -100,-58"/>
        <polygon id="s1-top-glow" data-fade class="pulse" points="0,0 100,-58 0,-116 -100,-58" fill="none" stroke="var(--teal)" stroke-width="2.4"/>
      </g>

    <text x="0" y="150" text-anchor="middle" class="label label-dim" data-fade id="lbl-snap">snapmaker</text>
    <line x1="-260" y1="120" x2="260" y2="120" class="stroke-dim" data-fade id="lbl-snap2"/>

    <g data-fade id="cube-labels" transform="translate(-260,-320)">

      <text x="0" y="16" class="label label-dim" id="top-sub">single tool · uniform color</text>

      <rect class="shot-frame" x="-14" y="-42" width="504" height="768" rx="10"/>
      <rect class="shot-bar" x="-14" y="-42" width="504" height="30" rx="10"/>

    </g>
    <g class="shot-card" transform="translate(505,220) scale(0.816)">
      <rect class="shot-frame" x="-14" y="-42" width="488" height="665" rx="10"/>
      <rect class="shot-bar" x="-14" y="-42" width="488" height="30" rx="10"/>
      <text class="shot-name" x="230" y="-22" text-anchor="middle">BIGTEST.3MF · FULL BOARD</text>
      <image href="images/REALPRINTS/RealPrint-02.webp" x="0" y="0" width="460" height="613"/>
    </g>
    <g class="shot-card" transform="translate(960,330) scale(0.49)">
      <rect class="shot-frame" x="-14" y="-42" width="1221" height="665" rx="10"/>
      <rect class="shot-bar" x="-14" y="-42" width="1221" height="30" rx="10"/>

  </g>

</svg>
</div>

<div id="dimmer"></div>
<div id="tag">
  <h1>Neotko<span>CM</span> Fork for <span>SnapMaker</span></h1>
  <p>your colors and <em>the full Sandwich</em>.</p>
  <div class="recap"><span>ColorStitch</span>·<span>PathBlend</span>·<span>MultiPass</span>·<span>Painter</span></div>
</div>

<button id="backBtn" onclick="location.href='index.html'" title="Back to menu (Esc)"><b>&lsaquo;</b> Menu</button>
<div id="progress"></div>

<div class="ui" id="ui">
  <button class="uibtn" id="btnPrev" title="Previous step (Left arrow)"><kbd>&larr;</kbd>prev</button>
  <button class="uibtn" id="btnPlay" title="Play / pause (Space)"><span id="playGlyph" class="pglyph">&#8214;</span><span id="playLbl">pause</span></button>
  <button class="uibtn" id="btnNext" title="Next step (Right arrow)">next<kbd>&rarr;</kbd></button>
  <button class="uibtn" id="btnReset" title="Restart (R)"><kbd>R</kbd>reset</button>

</div>

<script>
const TOTAL = 14;
let step = 0;
let autoplay = null;

const SVGNS = 'http://www.w3.org/2000/svg';
const S = 100;
const COL_A = '#ff15a5';
const COL_B = '#2196f3';
const COL_1 = '#e3ff2a';

const $  = q => document.querySelector(q);
const $$ = q => document.querySelectorAll(q);
const setText = (id,t) => { const e=document.getElementById(id); if(e) e.textContent=t; };
const fade = (id,on) => { const e=document.getElementById(id); if(e) e.classList.toggle('on',on); };
function clear(id){ const e=document.getElementById(id); if(e) e.innerHTML=''; }

function ditherThreshold(i){ return (i * 0.6180339887498949) % 1; }
function shapeEase(r){ return r*r*(3-2*r); }

// --- ColorStitch: Smooth blend (dithered) ---
function renderCSSmooth(containerId){
  const g = document.getElementById(containerId); g.innerHTML = '';
  const n = 10, band = S/n;
  for(let j=0;j<n;j++){
    const r = 1-(j/(n-1)), adj = shapeEase(r), d = ditherThreshold(j);
    const color = d < adj ? COL_B : COL_A;
    const rect = document.createElementNS(SVGNS,'rect');
    rect.setAttribute('x',0); rect.setAttribute('y', j*band);
    rect.setAttribute('width', S); rect.setAttribute('height', band+0.5);
    rect.setAttribute('fill', color); rect.setAttribute('class','band');
    g.appendChild(rect);
  }
}
// --- ColorStitch: Stripes (exact manual bands) ---
function renderCSStripes(containerId){
  const g = document.getElementById(containerId); g.innerHTML = '';
  const n = 10, band = S/n;
  for(let j=0;j<n;j++){
    const color = (j % 5) < 3 ? COL_A : COL_B;
    const rect = document.createElementNS(SVGNS,'rect');
    rect.setAttribute('x',0); rect.setAttribute('y', j*band);
    rect.setAttribute('width', S); rect.setAttribute('height', band+0.5);
    rect.setAttribute('fill', color); rect.setAttribute('class','band');
    g.appendChild(rect);
  }
}
// --- MultiPass: Glaze (opaque base + translucent tint) ---
function renderMPGlaze(containerA, containerB){
  clear(containerA); clear(containerB);
  const base = document.createElementNS(SVGNS,'rect');
  base.setAttribute('x',0); base.setAttribute('y',0);
  base.setAttribute('width',S); base.setAttribute('height',S);
  base.setAttribute('fill', COL_1);
  document.getElementById(containerA).appendChild(base);
  const tint = document.createElementNS(SVGNS,'rect');
  tint.setAttribute('x',0); tint.setAttribute('y',0);
  tint.setAttribute('width',S); tint.setAttribute('height',S);
  tint.setAttribute('fill', '#009688'); tint.setAttribute('opacity','0.4');
  document.getElementById(containerB).appendChild(tint);
}
// --- MultiPass: Cross-hatch (two Solid passes, perpendicular angles) ---
function renderMPHatch(containerA, containerB){
  clear(containerA); clear(containerB);
  const density = 8;
  const band = S/density;
  const gA = document.getElementById(containerA);
  const gB = document.getElementById(containerB);
  for(let i=0;i<density;i++){
    if(i % 2 !== 0) continue;
    const rA = document.createElementNS(SVGNS,'rect');
    rA.setAttribute('x',0); rA.setAttribute('y', i*band);
    rA.setAttribute('width', S); rA.setAttribute('height', band*0.85);
    rA.setAttribute('fill', COL_1); rA.setAttribute('class','band');
    gA.appendChild(rA);
    const rB = document.createElementNS(SVGNS,'rect');
    rB.setAttribute('x', i*band); rB.setAttribute('y', 0);
    rB.setAttribute('width', band*0.85); rB.setAttribute('height', S);
    rB.setAttribute('fill', '#009688'); rB.setAttribute('class','band'); rB.setAttribute('opacity','0.85');
    gB.appendChild(rB);
  }
}
// --- PathBlend: Full (ramp+cap, flat surface, optical gradient) ---
function renderPBFull(containerId){
  const g = document.getElementById(containerId); g.innerHTML = '';
  const r = document.createElementNS(SVGNS,'rect');
  r.setAttribute('x',0); r.setAttribute('y',0);
  r.setAttribute('width',S); r.setAttribute('height',S);
  r.setAttribute('fill', 'url(#pb-gradient)');
  g.appendChild(r);
}
// --- PathBlend: Half (no cap, ramp IS the surface — opacity ∝ h/H, same TD idea as v3) ---
function renderPBHalf(containerId){
  const g = document.getElementById(containerId); g.innerHTML = '';
  const K = 10, floor = 6, band = S/K;
  for(let i=0;i<K;i++){
    const t = i/(K-1);
    const h = floor + t*(S-floor);
    const opacity = Math.max(0.2, Math.min(1, h/S));
    const r = document.createElementNS(SVGNS,'rect');
    r.setAttribute('x',0); r.setAttribute('y', i*band);
    r.setAttribute('width', S); r.setAttribute('height', band+0.5);
    r.setAttribute('fill', COL_1); r.setAttribute('opacity', opacity.toFixed(2));
    g.appendChild(r);
  }
}

const states = [
  // STEP 1 — intro: title, recap cards, staircase base
  ()=>{
    fade('lbl-title',true);
    fade('lbl-sub',true);
    fade('recap-cards',true);
    fade('step1-box',true); fade('step2-box',true); fade('step3-box',true);
    fade('lbl-snap',true); fade('lbl-snap2',true);
    fade('cube-labels',true);
  },
  // STEP 2 — staircase framing: 3 fused steps, 1 object, top+penu only per step
  ()=>{
    fade('recap-cards',false);
    fade('staircase-intro',true);
    setText('top-sub','one object · three independent top surfaces');
  },
  // STEP 3 — isolate the 3 tops
  ()=>{
    fade('s1-top-glow',true); fade('s2-top-glow',true); fade('s3-top-glow',true);
    fade('insets',true);
    setText('top-label','3 TOP FACES · SANDWICH ZONE');
  },
  // STEP 4 — step 1: ColorStitch Stripes
  ()=>{
    renderCSStripes('s1-content-A');
    fade('legend',true);
    setText('leg-s1a-txt','ColorStitch · Stripes');
    setText('top-sub','step 1 · ColorStitch · Stripes (exact manual bands)');
  },
  // STEP 5 — step 2: MultiPass Cross-hatch
  ()=>{
    renderMPHatch('s2-content-A','s2-content-B');
    setText('leg-s2a-txt','MultiPass · Cross-hatch');
    setText('top-sub','step 2 · MultiPass · Cross-hatch (2 Solid passes, 90°)');
  },
  // STEP 6 — step 3: PathBlend Full
  ()=>{
    renderPBFull('s3-content-A');
    setText('leg-s3a-txt','PathBlend · Full');
    setText('top-sub','step 3 · PathBlend · Full (ramp + cap, flat, optical blend)');
  },
  // STEP 7 — MERGE #1: all 3 land on their real, separate top faces
  ()=>{
    fade('conn-ramp',true);
    fade('paint-step1',true); fade('paint-step2',true); fade('paint-step3',true);
    renderCSStripes('cubetop1-A');
    renderMPHatch('cubetop2-A','cubetop2-B');
    renderPBFull('cubetop3-A');
    setText('top-label','3 STEPS · 3 SANDWICHES · 1 OBJECT');
    setText('top-sub','first pass · each top keeps its own recipe');
  },
  // STEP 8 — step 3 repainted: PathBlend switches to Half (callback: opacity ∝ TD)
  ()=>{
    clear('s3-content-A'); clear('cubetop3-A');
    renderPBHalf('s3-content-A');
    renderPBHalf('cubetop3-A');
    fade('legend2',true);
    setText('leg-s3b-txt','PathBlend · Half');
    setText('top-sub','step 3 repainted · Half · no cap · opacity = h/H, same TD idea');
  },
  // STEP 9 — step 1 repainted: ColorStitch switches to Smooth blend
  ()=>{
    clear('s1-content-A'); clear('cubetop1-A');
    renderCSSmooth('s1-content-A');
    renderCSSmooth('cubetop1-A');
    setText('leg-s1b-txt','ColorStitch · Smooth blend');
    setText('top-sub','step 1 repainted · Smooth blend · same engine, different style');
  },
  // STEP 10 — step 2 repainted: MultiPass switches to Glaze + perimeter override
  ()=>{
    clear('s2-content-A'); clear('s2-content-B');
    clear('cubetop2-A'); clear('cubetop2-B');
    renderMPGlaze('s2-content-A','s2-content-B');
    renderMPGlaze('cubetop2-A','cubetop2-B');
    fade('lbl-perim',true);
    const perim = $('#s2-perim');
    perim.setAttribute('stroke-width','3');
    perim.setAttribute('opacity','1');
    setText('leg-s2b-txt','MultiPass · Glaze + perimeter override');
    setText('top-sub','step 2 repainted · Glaze · wall follows the pass color');
  },
  // STEP 11 — MERGE #2: the varied, repainted combination — second hero shot
  ()=>{
    setText('top-label','SAME OBJECT · REPAINTED');
    setText('top-sub','the Painter lets you change any step, any time');
  },
  // STEP 12 — recap montage: every recipe shown across both passes
  ()=>{
    setText('top-label','6 RECIPES · 3 STEPS · 2 PASSES');
    setText('top-sub','Stripes/Smooth · Cross-hatch/Glaze · Full/Half · one Sandwich engine');
  },
  // STEP 13 — RealColor view: classic vs TD-based optical preview
  ()=>{
    fade('shotdim',true);
    fade('shot-realcolor',true);
  },
  // STEP 14 — real prints: print vs screen, BIGTEST board + closeup
  ()=>{
    fade('shot-realcolor',false);
    fade('shot-proof',true);
  }
];

function rebuildTo(n){
  $$('[data-fade]').forEach(e=>e.classList.remove('on'));
  ['s1-content-A','s1-content-B','s2-content-A','s2-content-B','s3-content-A','s3-content-B',
   'cubetop1-A','cubetop1-B','cubetop2-A','cubetop2-B','cubetop3-A','cubetop3-B'].forEach(clear);
  const perim = $('#s2-perim');
  perim.setAttribute('stroke-width','0'); perim.setAttribute('opacity','0');
  $('#tag').classList.remove('on');
  $('#dimmer').classList.remove('on');
  setText('top-label','STAIRCASE · BASE STATE');
  setText('top-sub','single tool · uniform color');
  ['leg-s1a-txt','leg-s2a-txt','leg-s3a-txt','leg-s1b-txt','leg-s2b-txt','leg-s3b-txt'].forEach(id=>setText(id,'—'));
  for(let i=0;i<=n;i++) states[i]();
}

function next(){
  if(step < TOTAL-1){
    step++;
    states[step]();
    setText('stepNum','STEP '+String(step+1).padStart(2,'0')+' / '+String(TOTAL).padStart(2,'0'));
  }
}
function prev(){
  if(step > 0){
    step--;
    rebuildTo(step);
    setText('stepNum','STEP '+String(step+1).padStart(2,'0')+' / '+String(TOTAL).padStart(2,'0'));
  }
}
function reset(){
  step = 0;
  rebuildTo(0);
  setText('stepNum','STEP 01 / '+String(TOTAL).padStart(2,'0'));
}

let playing = false;
const STEP_MS = 2600;

function updateProgress(){
  const p = document.getElementById('progress');
  if(p) p.style.width = (TOTAL<=1 ? 100 : (step/(TOTAL-1))*100) + '%';
}
function updatePlayBtn(){
  const l = document.getElementById('playLbl');
  if(l) l.textContent = playing ? 'pause' : 'play';
  const g = document.getElementById('playGlyph');
  if(g) g.textContent = playing ? '\u2016' : '\u25B6';
}
function startAuto(){
  if(autoplay) return;
  playing = true; updatePlayBtn();
  autoplay = setInterval(()=>{
    if(step >= TOTAL-1) reset(); else next();
    updateProgress();
  }, STEP_MS);
}
function stopAuto(){
  if(autoplay){ clearInterval(autoplay); autoplay = null; }
  playing = false; updatePlayBtn();
}
function toggleAuto(){ playing ? stopAuto() : startAuto(); }
function userNext(){ stopAuto(); next(); updateProgress(); }
function userPrev(){ stopAuto(); prev(); updateProgress(); }
function userReset(){ stopAuto(); reset(); updateProgress(); }
function toggleClean(){ document.body.classList.toggle('clean'); }
function toggleFull(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.getElementById('btnPrev').onclick  = userPrev;
document.getElementById('btnNext').onclick  = userNext;
document.getElementById('btnPlay').onclick  = toggleAuto;
document.getElementById('btnReset').onclick = userReset;
document.getElementById('btnFull').onclick  = toggleFull;
document.getElementById('btnHide').onclick  = toggleClean;

// buttons must not keep keyboard focus, or Space would double-fire (click + shortcut)
document.querySelectorAll('.ui button, #backBtn').forEach(b=> b.addEventListener('mousedown', e=>e.preventDefault()));

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') userNext();
  else if(e.key==='ArrowLeft') userPrev();
  else if(e.key===' '){ e.preventDefault(); toggleAuto(); }
  else if(e.key==='r'||e.key==='R') userReset();
  else if(e.key==='f'||e.key==='F') toggleFull();
  else if(e.key==='h'||e.key==='H') toggleClean();
  else if(e.key==='Escape') location.href='index.html';
});

reset();
updateProgress();
startAuto();
</script>
