<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Height Adaptive Effects: layer bands crossed by a value-vs-Z curve.
       Fills/strokes only (nanosvg-safe); avoid pure black (RGB==0 is treated as
       background by the icon recolor pipeline). -->
