<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Align & Stack: isometric cube with a plane descending onto its top face.
       Fills only (nanosvg-safe); avoid pure black (RGB==0 is treated as
       background by the gizmo icon recolor pipeline). -->
  <!-- descending plane -->
  <polygon points="20,3 29.5,7.8 20,12.6 10.5,7.8"
           style="fill:none;stroke:#009688;stroke-width:1.6"/>
  <!-- flanking down arrows -->
  <polygon points="5,8 5,14 3,14 6.5,19 10,14 8,14 8,8" style="fill:#009688"/>
  <polygon points="32,8 32,14 30,14 33.5,19 37,14 35,14 35,8" style="fill:#009688"/>
  <!-- cube: top / left / right faces -->
  <polygon points="20,16 31,21.5 20,27 9,21.5" style="fill:#009688"/>
  <polygon points="9,21.5 20,27 20,38 9,32.5" style="fill:#2b3436"/>
  <polygon points="20,27 31,21.5 31,32.5 20,38" style="fill:#2b3436"/>
</svg>
