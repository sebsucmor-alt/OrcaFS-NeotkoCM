  <polyline points="8,32 33,32" style="fill:none;stroke:#b6b6b6;stroke-width:1.6"/>
  <path d="M 8,27 C 14,27 13,16 20,16 S 27,10 33,10"
        style="fill:none;stroke:#009688;stroke-width:2.2;stroke-linecap:round"/>
  <circle cx="8"  cy="27" r="2.6" style="fill:#009688"/>
  <circle cx="20" cy="16" r="2.6" style="fill:#009688"/>
  <circle cx="33" cy="10" r="2.6" style="fill:#009688"/>
</svg>
