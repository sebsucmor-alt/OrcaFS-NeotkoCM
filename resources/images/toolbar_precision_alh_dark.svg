<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Dark variant. The icon pipeline recolors per state, so geometry is what
       matters; this file existing at all is required (a missing file leaves
       the sprite row empty = invisible toolbar slot). -->
