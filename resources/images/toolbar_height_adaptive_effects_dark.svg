  <g style="stroke:#d5dbdd;stroke-width:1.1;opacity:0.55">
    <line x1="7" y1="30" x2="34" y2="30"/>
    <line x1="7" y1="25" x2="34" y2="25"/>
    <line x1="7" y1="20" x2="34" y2="20"/>
    <line x1="7" y1="15" x2="34" y2="15"/>
    <line x1="7" y1="10" x2="34" y2="10"/>
  </g>
  <path d="M 13,33 C 13,27 27,25 27,20 S 13,13 13,7"
        style="fill:none;stroke:#009688;stroke-width:2.2;stroke-linecap:round"/>
  <circle cx="13" cy="30" r="2.4" style="fill:#009688"/>
  <circle cx="27" cy="20" r="2.4" style="fill:#009688"/>
  <circle cx="13" cy="10" r="2.4" style="fill:#009688"/>
</svg>
